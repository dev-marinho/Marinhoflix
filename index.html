<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Marinho | Videomaker e Storymaker mobile</title>
  <meta name="description" content="Portfólio de Marinho: captação e edição de vídeos para gastronomia, cirurgias, institucionais e agências." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=202610311511" />
</head>
<body>

  <!-- 1. Abertura: "M" -> "MARINHO" -->
  <section class="screen intro is-active" id="intro" aria-label="Marinho">
    <div class="logo" id="intro-logo">
      <span class="logo__m">M</span><span class="logo__rest" id="logo-rest"></span>
    </div>
  </section>

  <!-- 2. Qual o seu negócio? -->
  <section class="screen profiles" id="profiles" aria-label="Escolha o seu negócio">
    <div class="profiles__hero">
      <div class="profiles__bg" id="profiles-bg"></div>
      <div class="profiles__shade"></div>
      <div class="profiles__feature">
        <span class="profiles__brand">MARINHO</span>
        <h1 class="profiles__title" id="feature-title"></h1>
        <p class="profiles__sub" id="feature-sub"></p>
      </div>
    </div>

    <div class="profiles__panel">
      <h2 class="profiles__question">Qual o seu negócio?</h2>
      <ul class="profiles__grid" id="profiles-grid"></ul>
    </div>
  </section>

  <!-- Som da abertura (arquivo próprio, livre de direitos) -->
  <audio id="intro-audio" src="assets/audio/intro.mp3?v=202610311511" preload="auto" playsinline></audio>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=202610311511"></script>
  <script src="js/icons.js?v=202610311511"></script>
  <script src="js/app.js?v=202610311511"></script>
</body>
</html>
